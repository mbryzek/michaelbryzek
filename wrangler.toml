# Cloudflare Pages configuration for bryzek.com.
#
# The site is deployed with `wrangler pages deploy .svelte-kit/cloudflare`
# (see devops/bin/release-sveltekit), which reads the bindings below. Only the
# /trips/* routes use them; every other page is a static asset.
#
# EVERY by-hand wrangler command for this site needs TWO things set, because
# they fix two different failures:
#
#   export XDG_CONFIG_HOME=$HOME/.cloudflare/personal    # which login
#   export CLOUDFLARE_ACCOUNT_ID=5d441200f99d0384528d8d97fa28bb27   # which account
#
# WHICH LOGIN: Cloudflare access here is a per-account `wrangler login` OAuth
# profile. A bare `wrangler` reads its own global config — a different, older
# session — and fails "Authentication error [code: 10000]". The trap is that
# `wrangler whoami` there reports the right email, Super Administrator and
# d1:write; that scope list is printed from local config, not the server.
#
# WHICH ACCOUNT: one login can see several accounts. With nothing pinned,
# wrangler picks one — it resolved to the clubaid.ai account (4b2f…) and failed
# the same way while setting this app's secrets. The env var is the only lever:
# Pages rejects `account_id` in this file outright ("Configuration file for
# Pages projects does not support account_id"), so it cannot be pinned here.
#
# The error is the benign outcome. The one to avoid is a command that SUCCEEDS
# against the wrong account and quietly creates a resource bryzek.com will never
# read.
#
# `dev release app` needs neither — release-sveltekit sets the profile itself
# and reads the account from the app config.
#
# ONE-TIME SETUP (see src/routes/trips/europe-26/README.md) — with both vars
# exported as above:
#   wrangler d1 create bryzek-trips
#   wrangler d1 migrations apply bryzek-trips --remote
#   wrangler pages secret put TRIP_PASSWORD_HASH --project-name michaelbryzek
#   wrangler pages secret put TRIP_COOKIE_SECRET --project-name michaelbryzek
#   wrangler pages secret put ANTHROPIC_API_KEY  --project-name michaelbryzek
#
# The database and its migrations are already applied — only the secrets remain.

name = "michaelbryzek"
# Kept at or behind the date the pinned wrangler's local runtime supports, so
# `wrangler pages dev` runs the same configuration that deploys. A date in the
# future of the local workerd binary fails to boot locally while deploying fine,
# which is the worst of both.
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "TRIP_DB"
database_name = "bryzek-trips"
# Replace with the id printed by `wrangler d1 create bryzek-trips`.
#
# Local dev ignores the value (it keys storage by binding name), so this
# placeholder is enough to run `wrangler pages dev`. It is deliberately not a
# well-formed UUID: a real-looking wrong id would deploy and then fail at
# request time with a confusing "no such table", whereas this is rejected up
# front. An empty string is worse still — it fails wrangler's own config
# validation and breaks local dev too.
database_id = "d17853ac-7062-414a-b36c-5a11614d90e8"
migrations_dir = "migrations"
